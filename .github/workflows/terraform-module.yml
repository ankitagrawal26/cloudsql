      #   with:
      #     name: terraform-outputs-basic-${{ github.run_number }}
      #     path: tftest/basic/outputs.json
      #     retention-days: 90

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🎯 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Provider:** ${{ env.PROVIDER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Examples:** ${{ needs.detect-provider.outputs.examples }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Triggered:** ${{ github.event_name == 'workflow_dispatch' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  update-terraform-docs:
    name: Update Terraform Documentation
    needs: [detect-provider, terraform-deploy]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_IAC_ID }}
          private-key: ${{ secrets.GH_APP_IAC_PEM }}
          owner: Unilever-IaC-Core

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git to use GitHub App token
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Generate Module Documentation
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: false
          config-file: .terraform-docs.yml

      - name: Generate Basic Example Docs
        if: contains(needs.detect-provider.outputs.examples, 'basic')
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: tftest/basic
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Generate Complete Example Docs
        if: contains(needs.detect-provider.outputs.examples, 'complete')
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: tftest/complete
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Check for documentation changes
        id: docs-check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📝 No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Documentation changes detected"
            git diff --stat
          fi

      - name: Commit and Push Documentation Updates
        if: steps.docs-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md tftest/*/README.md
          git commit -m "docs: auto-update terraform documentation [skip ci]"
          git push

      - name: Documentation Summary
        if: always()
        run: |
          echo "## 📚 Terraform Documentation Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Module:** Updated" >> $GITHUB_STEP_SUMMARY
          echo "- **Examples:** ${{ needs.detect-provider.outputs.examples }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes:** ${{ steps.docs-check.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.docs-check.outputs.has_changes }}" == "true" ]; then
            echo "✅ Documentation has been automatically updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No documentation updates required" >> $GITHUB_STEP_SUMMARY
          fi
