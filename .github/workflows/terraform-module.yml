      # - name: Terraform Output (GCP) - Basic Example
      #   if: |
      #     needs.detect-provider.outputs.provider == 'gcp' &&
      #     contains(needs.detect-provider.outputs.examples, 'basic') &&
      #     github.event_name == 'workflow_dispatch'
